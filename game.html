function pauseGameTime() {
  if (!isPaused) {
    isPaused = true;
    hiddenStart = Date.now();
  }
}

function resumeGameTime() {
  if (isPaused) {
    isPaused = false;
    pausedTime += Date.now() - hiddenStart;
  }
}

document.addEventListener("visibilitychange", () => {
  if (document.hidden) pauseGameTime();
  else resumeGameTime();
});

window.addEventListener("blur", pauseGameTime);
window.addEventListener("focus", resumeGameTime);

function startGame(){
 document.getElementById("startBtn").classList.add("hide");
gameOver = true;
  isSelecting = true; // ⭐ 추가
  document.getElementById("charScreen").style.display = "flex";
 draw();
}

function spawnEnemy(){

  const side = Math.floor(Math.random() * 4);

  let x, y;

  // 🔥 위치를 화면 바깥으로 설정
  if (side === 0) { // 위
    x = Math.random() * canvas.width;
    y = -20;
  }
  else if (side === 1) { // 아래
    x = Math.random() * canvas.width;
    y = canvas.height + 20;
  }
  else if (side === 2) { // 왼쪽
    x = -20;
    y = Math.random() * canvas.height;
  }
  else { // 오른쪽
    x = canvas.width + 20;
    y = Math.random() * canvas.height;
  }

  // 🔥 중심(플레이 영역) 향하도록 방향 계산
  const targetX = canvas.width / 2;
  const targetY = canvas.height / 2;

  let dx = targetX - x;
  let dy = targetY - y;
  const length = Math.hypot(dx, dy);

  dx /= length;
  dy /= length;

  const speed = 1.5 + Math.random() * 2.5;

  enemies.push({
    x,
    y,
    dx,
    dy,
    speed,
    type: "normal",
    dashState: "idle",
    dashTimer: 0
  });
}

setInterval(()=>{
  if(gameOver) return;

  const time = (Date.now() - startTime - pausedTime) / 1000;

  // 일반 적
  const count = 1 + Math.floor(time / 15);
  for (let i = 0; i < count; i++) {
    spawnEnemy();
  }

  // 🔥 30초마다 보스
  const phase = Math.floor(time / 30);

  if (phase > lastBossPhase && time >= 30) {
    spawnBoss();
    lastBossPhase = phase;
  }

},1000);
function spawnBoss(){
  enemies.push({
    x: Math.random()*600,
    y: 0,
    speed: 1.2,
    type: "boss",
    dashState: "idle",
    dashTimer: 60,
    dashTargetX: 0,
    dashTargetY: 0
  });
}

function update(delta){
  if(gameOver) return;

  // 플레이어 이동

// 저장
window.saveScoreToServer = async (score) => {
  const q = query(rankingRef, orderBy("score","desc"), limit(10));
  const snapshot = await getDocs(q);

  let isTop10 = false;

  if (snapshot.size < 10) isTop10 = true;
  else {
    const last = snapshot.docs[snapshot.docs.length - 1].data().score;
    if (Number(score) > last) isTop10 = true;
  }

  if (!isTop10) {
    return;
  }

  const name = prompt("TOP10 진입! 이름 입력") || "익명";

  await addDoc(rankingRef, {
    name,
    score: Number(score),
    time: Date.now()
  });
  alert("🏆 랭킹 등록 완료!");
};

// 불러오기
function loadRanking(){
  const q = query(rankingRef, orderBy("score","desc"), limit(10));

  onSnapshot(q, (snapshot)=>{
    const list = document.getElementById("rankingList");
    list.innerHTML = "";

    let i = 1;

    snapshot.forEach(doc=>{
      const d = doc.data();

      const item = document.createElement("div");
      item.className = "rankItem";

      item.innerHTML = `
        <span class="rankName">${i}. ${d.name}</span>
        <span class="rankScore">${d.score}초</span>
      `;

      list.appendChild(item);
      i++;
    });
  });
}
loadRanking();

  draw();
};

window.onload = () => {
  draw();
};
