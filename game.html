<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>진격의 규리</title>

<style>
body {
  margin:0;
  background: linear-gradient(135deg,#fce7f3,#e0e7ff);
  display:flex;
  flex-direction:column;
  align-items:center;
  font-family:sans-serif;
}

#wrap { display:flex; gap:20px; margin-top:10px; }



canvas {
  border-radius:12px;
  box-shadow:0 10px 20px rgba(0,0,0,0.2);
}

#ui { margin-top:10px; font-weight:bold; }

#rankingBox {
  white-space:pre-line;
  width:200px;
  background:white;
  padding:15px;
  border-radius:15px;
  box-shadow:0 8px 20px rgba(0,0,0,0.1);
}
@keyframes smokeFade {
  from {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }
  to {
    opacity: 0;
    transform: translate(-50%, -80%) scale(2);
  }
}
#skillBar{
  position:absolute;
  top:10px;
  left:10px;
  display:flex;
  gap:12px;
  z-index:10;
}

/* 카드 */
.skillCard{
  width:100px;
  background:rgba(20,20,20,0.85);
  border:1px solid rgba(255,255,255,0.2);
  border-radius:10px;
  padding:6px;
  color:white;
  position:relative;
  backdrop-filter: blur(6px);
}

/* 스킬 이름 */
.skillName{
  font-size:11px;
  opacity:0.8;
}

/* Q 키 표시 */
.skillKey{
  position:absolute;
  right:8px;
  top:6px;
  width:22px;
  height:22px;
  border-radius:6px;
  background:white;
  color:black;
  font-weight:bold;
  font-size:12px;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* 바 */
.bar{
  margin-top:6px;
  height:10px;
  background:rgba(255,255,255,0.1);
  border-radius:6px;
  overflow:hidden;
  position:relative;
}

/* 지속 */
.fill.duration{
  position:absolute;
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#00f0ff,#00ff95);
}

/* 쿨타임 */
.fill.cooldown{
  position:absolute;
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#ff3b3b,#ff9900);
  opacity:0.9;
}

/* 상태 텍스트 */
.skillState{
  margin-top:4px;
  font-size:10px;
  text-align:center;
  opacity:0.7;
}
#gameArea{
  position:relative;
  display:flex;
  flex-direction:column;
  align-items:center;
}
#skillBar {
  display: none; /* 기본 숨김 */
}

#skillBar.show {
  display: flex; /* 히든모드일 때만 보임 */
}
#countdown{
  position:absolute;   /* fixed → absolute로 변경 */
  transform:translate(-50%, -100%);
}
</style>
</head>

<body>

<h3>🎮 진격의 규리</h3>
<button onclick="startGame()">▶ 게임 시작</button>
<button onclick="goBack()">⬅ 뒤로가기</button>

<div id="wrap">
  <div id="rankingBox">로딩중...</div>
  <div id="gameArea">
<div id="countdown" style="
  font-size:30px;
  font-weight:bold;
  color:white;
  text-shadow:0 0 10px black;
  display:none;
  pointer-events:none;
"></div>

    <div id="skillBar">
      <div class="skillCard">
  <div class="skillName">Q - 거인화</div>
  <div class="skillKey">Q</div>

  <div class="bar">
    <div id="qDurationFill" class="fill duration"></div>
    <div id="qCooldownFill" class="fill cooldown"></div>
  </div>

  <div class="skillState" id="qState">READY</div>
</div>
    </div>

    <canvas id="gameCanvas" width="600" height="400"></canvas>
    <div id="ui">Time: 0</div>

   </div>
</div>

<!-- 🔥 게임 코드 -->
<script>
function goBack(){
  location.href = "index.html";
}
const playerImg = new Image();
playerImg.src = "player.png";
const erenImg = new Image();
erenImg.src = "eren.png"; // 
const titanImg = new Image();
titanImg.src = "titan.png";

const enemyImg = new Image();
enemyImg.src = "enemy.png";
const bossImg = new Image();
bossImg.src = "boss.png";

const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
const rect = canvas.getBoundingClientRect();

let player, enemies, startTime, gameOver;
let pausedTime = 0;
let hiddenStart = 0;
let isPaused = false;
let keys = {};
let lastTime = 0;
let secretEn = "rncnrgownak";
let secretKr = "구축해주마";
let inputBuffer = "";
let hiddenMode = false;
let titanMode = false;
let titanCooldown = false;
let erenMode = false;
let lightningActive = false;
let lightningX = 0;
let lightningY = 0;
let titanCooldownTime = 0;
let titanDurationTime = 0;
let lastBossTime = 0;


// 🔥 키 입력 처리 (정석)
document.addEventListener("keydown", e => {

  keys[e.key.toLowerCase()] = true;

  // 🔥 Q 스킬은 항상 먼저 처리
 if (e.key.toLowerCase() === "q") {
  if (!erenMode) return;
  if (titanCooldown) return;

  activateTitanMode();
  return;
}

  // 🔥 히든모드일 때는 입력만 막고 Q는 유지
  if (hiddenMode) return;

  if (e.key.length === 1) {
    inputBuffer += e.key.toLowerCase();
  }

  if (inputBuffer.length > 20) {
    inputBuffer = inputBuffer.slice(-20);
  }

  if (
    inputBuffer.includes(secretEn) ||
    inputBuffer.includes(secretKr)
  ) {
    activateHiddenMode();
  }
});

document.addEventListener("keyup", e => {
  keys[e.key.toLowerCase()] = false;
});

function updateSkillUI(){

  const cd = document.getElementById("qCooldownFill");
  const dur = document.getElementById("qDurationFill");
  const state = document.getElementById("qState");

  // 🔥 쿨타임
  if (titanCooldown){
    const total = 45000;
    const remain = Math.max(0, total - (Date.now() - titanCooldownTime));

    cd.style.width = (remain / total) * 100 + "%";

    state.innerText = "쿨타임";
    state.style.color = "#ff5555";
  } 
  else {
    cd.style.width = "0%";
  }

  // 🔥 지속시간
  if (titanMode){
    const total = 5000;
    const remain = Math.max(0, total - (Date.now() - titanDurationTime));

    dur.style.width = (remain / total) * 100 + "%";

    state.innerText = "ACTIVE";
    state.style.color = "#00ffcc";
  } 
  else {
    dur.style.width = "0%";

    if (!titanCooldown){
      state.innerText = "READY";
      state.style.color = "#ffffff";
    }
  }
}
function pauseGameTime() {
  if (!isPaused) {
    isPaused = true;
    hiddenStart = Date.now();
  }
}

function resumeGameTime() {
  if (isPaused) {
    isPaused = false;
    pausedTime += Date.now() - hiddenStart;
  }
}

document.addEventListener("visibilitychange", () => {
  if (document.hidden) pauseGameTime();
  else resumeGameTime();
});

window.addEventListener("blur", pauseGameTime);
window.addEventListener("focus", resumeGameTime);

function startGame(){
  keys = {};
  player = {x:300,y:200,speed:4};
  enemies = [];
  startTime = Date.now();
  gameOver = false;
  lastTime = 0;
  pausedTime = 0;
  isPaused = false;
  hiddenMode = false;
  inputBuffer = "";

  titanCooldown = false;
 
  lightningActive = false;
  requestAnimationFrame(loop);
}

function spawnEnemy(){
  const time = (Date.now() - startTime - pausedTime) / 1000;

  const baseSpeed = 0.8 + Math.random()*1.0;
  let speed = Math.min(baseSpeed + time * 0.1, 3.5);

  let type = "normal";

 
  enemies.push({
    x: Math.random()*600,
    y: 0,
    speed: speed,
    type: type,
  dashState: "idle", // idle → warn → dash
  dashTimer: 0,
  dashTargetX: 0,
  dashTargetY: 0
  });
}

setInterval(()=>{
  if(gameOver) return;

  const time = (Date.now() - startTime - pausedTime) / 1000;

  // 일반 적
  const count = 1 + Math.floor(time / 15);
  for (let i = 0; i < count; i++) {
    spawnEnemy();
  }

  // 🔥 30초마다 보스 등장
if (time - lastBossTime >= 30) {
  spawnBoss();
  lastBossTime = time;
}
},1000);

function spawnBoss(){
  enemies.push({
    x: Math.random()*600,
    y: 0,
    speed: 1.2,
    type: "boss",
    dashState: "idle",
    dashTimer: 60,
    dashTargetX: 0,
    dashTargetY: 0
  });
}

function update(delta){
  if(gameOver) return;

  // 플레이어 이동
  if(keys["arrowup"] || keys["w"]) player.y -= player.speed * delta;
  if(keys["arrowdown"] || keys["s"]) player.y += player.speed * delta;
  if(keys["arrowleft"] || keys["a"]) player.x -= player.speed * delta;
  if(keys["arrowright"] || keys["d"]) player.x += player.speed * delta;

  // 맵 밖 제한
  if (player.x < 0) player.x = 0;
  if (player.y < 0) player.y = 0;
  if (player.x > canvas.width) player.x = canvas.width;
  if (player.y > canvas.height) player.y = canvas.height;

  enemies.forEach(e => {

    let dx = player.x - e.x;
    let dy = player.y - e.y;
    let dist = Math.hypot(dx, dy);
    if (dist === 0) dist = 0.01;

    // 🔥 보스 패턴
    if (e.type === "boss") {

      if (e.dashState === "idle") {

        e.dashTimer -= delta;

        if (e.dashTimer <= 0) {
          e.dashState = "warn";
          e.dashTimer = 180;
          e.dashTargetX = player.x;
          e.dashTargetY = player.y;
        }

        // 평소엔 추적
        e.x += dx/dist * e.speed * delta;
        e.y += dy/dist * e.speed * delta;
      }

      else if (e.dashState === "warn") {

        e.dashTimer -= delta;

        // 멈춤 (긴장감)
        if (e.dashTimer <= 0) {
          e.dashState = "dash";
        }
      }

      else if (e.dashState === "dash") {

        let dx2 = e.dashTargetX - e.x;
        let dy2 = e.dashTargetY - e.y;
        let dist2 = Math.hypot(dx2, dy2);

        if (dist2 < 5) {
          e.dashState = "idle";
          e.dashTimer = 120;
        } else {
          e.x += dx2/dist2 * 12 * delta;
          e.y += dy2/dist2 * 12 * delta;
        }
      }

    } else {
      // 일반 적
      e.x += dx/dist * e.speed * delta;
      e.y += dy/dist * e.speed * delta;
    }

    // 🔥 충돌 처리
    let hitRange = 20;

    if (e.type === "boss") hitRange = 40;
    if (erenMode && titanMode) hitRange = (40 * 2.5) / 2;

    	if (dist < hitRange) {

  if (erenMode && titanMode) {
    spawnSmokeEffect(e.x, e.y);
    enemies = enemies.filter(en => en !== e);
    return;
  }

  if (gameOver) return; // ⭐ 이미 죽었으면 무시

  gameOver = true;

  const score = ((Date.now() - startTime - pausedTime) / 1000).toFixed(2);

  saveScoreToServer(score);

  setTimeout(() => {
    alert("생존: " + score + "초");
  }, 0);

  return; // ⭐ 여기 추가 (이게 핵심)
}

  });

  // UI 업데이트
  if(!gameOver){
    document.getElementById("ui").innerText =
      "Time: "+((Date.now() - startTime - pausedTime)/1000).toFixed(1);
  }
}function updateCountdown(){
  const el = document.getElementById("countdown");

  if (!titanMode) {
    el.style.display = "none";
    return;
  }

  const total = 5000;
  const remain = total - (Date.now() - titanDurationTime);

  if (remain <= 3000 && remain > 0) {
    el.style.display = "block";
    el.innerText = Math.ceil(remain / 1000);

    const rect = canvas.getBoundingClientRect();

el.style.left = player.x + "px";
el.style.top  = player.y - 40 + "px";
  } else {
    el.style.display = "none";
  }
}

function loop(time){
  if(gameOver) return;

  const delta = (time - lastTime) / 16.67;
  lastTime = time;

  update(delta);
  draw();
  updateSkillUI();
  updateCountdown();

  requestAnimationFrame(loop);
}

function spawnSmokeEffect(x, y){

  const rect = canvas.getBoundingClientRect(); // ⭐ 중요: 여기서 매번 최신 위치 가져옴

  const smoke = document.createElement("div");
  smoke.style.position = "fixed";

  // 🔥 캔버스 위치 보정
  smoke.style.left = (rect.left + x) + "px";
  smoke.style.top = (rect.top + y) + "px";

  smoke.style.width = "30px";
  smoke.style.height = "30px";
  smoke.style.borderRadius = "50%";

  // 🔥 연기 느낌 강화
  smoke.style.background = "rgba(120,120,120,0.7)";
  smoke.style.filter = "blur(2px)";

  smoke.style.transform = "translate(-50%, -50%)";
  smoke.style.animation = "smokeFade 0.5s ease-out forwards";
  smoke.style.pointerEvents = "none";
  smoke.style.zIndex = 9999;

  document.body.appendChild(smoke);

  setTimeout(() => smoke.remove(), 500);
}
function drawLightning(x, y){
  ctx.strokeStyle = "white";
  ctx.lineWidth = 3;

  for (let i = 0; i < 6; i++) {
    ctx.beginPath();
    ctx.moveTo(x + (Math.random() * 10 - 5), 0);

    let currentY = 0;
    while (currentY < y) {
      let nextY = currentY + 20 + Math.random() * 20;
      let nextX = x + (Math.random() * 40 - 20);

      ctx.lineTo(nextX, nextY);
      currentY = nextY;
    }

    ctx.stroke();
  }
}

function draw(){
  ctx.fillStyle = "#C2B280";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // 번개
  if (lightningActive) {
    drawLightning(lightningX, lightningY);
  }

  // 플레이어
  let size = 40;

  if (erenMode && titanMode) {
    size = 40 * 2.5;
  } else if (erenMode) {
    size = 40;
  }

  ctx.drawImage(
    playerImg,
    player.x - size/2,
    player.y - size/2,
    size,
    size
  );

  // 적
  enemies.forEach(e => {

    const img = e.type === "boss" ? bossImg : enemyImg;
    const size = e.type === "boss" ? 100 : 40;

    ctx.drawImage(
      img,
      e.x - size/2,
      e.y - size/2,
      size,
      size
    );

    // 보스 경고 표시
    if (e.type === "boss" && e.dashState === "warn") {

      ctx.strokeStyle = "red";
      ctx.lineWidth = 2;

      ctx.beginPath();
      ctx.arc(e.dashTargetX, e.dashTargetY, 20, 0, Math.PI * 2);
      ctx.stroke();

      const seconds = Math.ceil(e.dashTimer / 60);

      ctx.fillStyle = "white";
      ctx.font = "20px Arial";
      ctx.textAlign = "center";

      ctx.fillText(seconds, e.x, e.y - 40);
    }

  });
}

function activateHiddenMode(){
  if (hiddenMode) return;
  hiddenMode = true;

  document.getElementById("skillBar").classList.add("show");
  
  inputBuffer = "";

  // 게임 멈춤
  gameOver = true;

  // 🔥 검은 화면 생성
  const overlay = document.createElement("div");
  overlay.style.position = "fixed";
  overlay.style.top = "0";
  overlay.style.left = "0";
  overlay.style.width = "100%";
  overlay.style.height = "100%";
  overlay.style.background = "black";
  overlay.style.display = "flex";
  overlay.style.justifyContent = "center";
  overlay.style.alignItems = "center";
  overlay.style.zIndex = "9999";

  // 🔥 대사 텍스트
  const text = document.createElement("div");
  text.innerText = "駆逐してやる。\nこの世から… 一匹残らず！！\n\n구축해주마. 이 세상에서, 한 마리도 남김없이!!";
  text.style.color = "white";
  text.style.fontSize = "28px";
  text.style.textAlign = "center";
  text.style.whiteSpace = "pre-line";

  overlay.appendChild(text);
  document.body.appendChild(overlay);

  // ⏱️ 2.5초 후 에렌 모드 진입
  setTimeout(() => {

    // 🔥 텍스트 변경 (에렌 모드)
    text.innerText = "⚔️ 에렌 모드";

    // ⏱️ 1초 후 실제 전환
    setTimeout(() => {

      overlay.remove();

      // 캐릭터 변경
      playerImg.src = erenImg.src;
      erenMode = true;

      // 게임 재개
      playerImg.src = erenImg.src;
      erenMode = true;
      gameOver = false;   // ⭐ restart 대신 이걸로
      requestAnimationFrame(loop);
   

    }, 1000);

  }, 2500);
}

function activateTitanMode(){
  titanCooldown = true;
  titanMode = true;

  titanCooldownTime = Date.now();   // ⭐ 여기 넣기
  titanDurationTime = Date.now();   // ⭐ 여기 넣기

  // 🔥 즉시 위치 저장
  lightningX = player.x;
  lightningY = player.y;
  lightningActive = true;

  // 🔥 즉시 변신
  playerImg.src = titanImg.src;

  // 🔥 아주 짧게만 번개 유지 (다음 프레임에서 자동 종료)
  requestAnimationFrame(() => {
    setTimeout(() => {
      lightningActive = false;
    }, 100);
  });

  // 5초 유지
  setTimeout(() => {
    playerImg.src = erenImg.src;
    titanMode = false;
  }, 5000);

  // 45초 쿨타임
  setTimeout(() => {
    titanCooldown = false;
  }, 45000);

}</script>

<!-- 🔥 Firebase + 랭킹 -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore,
  collection,
  addDoc,
  query,
  orderBy,
  limit,
  getDocs,
  onSnapshot
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDMPP4cTbMIIAFE7PBykIdydmhOEb_j3UE",
  authDomain: "gyut5-8a2fc.firebaseapp.com",
  projectId: "gyut5-8a2fc",
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const rankingRef = collection(db, "ranking");

// 저장
window.saveScoreToServer = async (score) => {
  const q = query(rankingRef, orderBy("score","desc"), limit(10));
  const snapshot = await getDocs(q);

  let isTop10 = false;

  if (snapshot.size < 10) isTop10 = true;
  else {
    const last = snapshot.docs[snapshot.docs.length - 1].data().score;
    if (Number(score) > last) isTop10 = true;
  }

  if (!isTop10) {
    return;
  }

  const name = prompt("TOP10 진입! 이름 입력") || "익명";

  await addDoc(rankingRef, {
    name,
    score: Number(score),
    time: Date.now()
  });

  alert("🏆 랭킹 등록 완료!");
};

// 불러오기
function loadRanking(){
  const q = query(rankingRef, orderBy("score","desc"), limit(10));

  onSnapshot(q, (snapshot)=>{
    let text = "🏆 TOP 10\n\n";
    let i=1;

    snapshot.forEach(doc=>{
      const d = doc.data();
      text += `${i}. ${d.name} - ${d.score}초\n`;
      i++;
    });

    document.getElementById("rankingBox").innerText = text;
  });
}

loadRanking();

</script>

</body>
</html>
